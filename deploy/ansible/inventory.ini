[mavenrepo_servers]
mvn-dev-repo.slab.com

# Add more hosts here as the repo is rolled out to other members of the fleet,
# e.g. a future mvn-repo.slab.com for a production instance -- give it its own
# entry under group_vars/mavenrepo_servers/ or a host_vars/<host>.yml override
# for anything that differs (domain, tls mode, data dir, etc).

# --- Optional: two-backend HA with a load balancer -------------------------
# See "Optional: two-backend HA with a load balancer" in
# deploy/ansible/README.md before enabling this -- it's a real topology
# change (separate host names for the backends, DNS repointed at the LB),
# not just uncommenting lines here. To switch to it: replace the single
# mvn-dev-repo.slab.com entry above with two distinct backend host names, and
# uncomment the [mavenrepo_lb] group below. The mavenrepo_lb play in
# playbook.yml matches zero hosts and does nothing while that group doesn't
# exist, so leaving this commented out doesn't affect today's single-host
# deployment.
#
# [mavenrepo_lb]
# mvn-dev-repo-lb.slab.com
