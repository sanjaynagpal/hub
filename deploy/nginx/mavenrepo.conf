# nginx reverse proxy + TLS termination in front of mavenrepo.
#
# Install:
#   cp mavenrepo.conf /etc/nginx/sites-available/mavenrepo.conf
#   ln -s /etc/nginx/sites-available/mavenrepo.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# mavenrepo itself must be bound to loopback only, since nginx is now the
# only thing that should see plaintext traffic:
#   ./mavenrepo -addr 127.0.0.1:8080 -root /opt/maven-repo -user deployer -pass s3cret
# (or, if running via Docker: `docker run -p 127.0.0.1:8080:8080 ...`)
#
# TODO: replace maven.internal.example.com below with your real hostname,
# and see renew-cert.sh for how the cert files under ssl_certificate* get there.

upstream mavenrepo {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name maven.internal.example.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name maven.internal.example.com;

    ssl_certificate     /etc/nginx/certs/maven.internal.example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/maven.internal.example.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:mavenrepo_ssl:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

    # mvn deploy uploads (jars/wars/zips) can be sizeable; raise nginx's default 1m cap.
    client_max_body_size 500m;
    # Stream uploads straight to the upstream instead of buffering the whole
    # request body to disk first -- matters for large artifact PUTs.
    proxy_request_buffering off;

    location / {
        # If mavenrepo is run with -read-only (artifacts published out-of-band
        # instead of via `mvn deploy` -- see the README's "Read-only mode"
        # section), uncomment this so nginx enforces it too, independently of
        # the backend:
        #
        # limit_except GET HEAD {
        #     deny all;
        # }

        proxy_pass http://mavenrepo;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
